name: Flutter Web Deploy
on:
  push:
    branches:
      - main # This triggers the build every time you push to the main branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. Pull the code from your repository
      - uses: actions/checkout@v4

      # 2. Set up the Flutter environment on the virtual machine
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 3. Get your project dependencies (the 'pubspec.yaml' stuff)
      - name: Get dependencies
        run: flutter pub get

      # 4. Build the Flutter Web version of your app
      - name: Build Web
        run: flutter build web --release

      # 5. Send the finished 'build/web' folder to Firebase
      - name: Deploy to Firebase
        uses: w9jds/firebase-action@v11.16.0
        with:
          args: deploy --only hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}